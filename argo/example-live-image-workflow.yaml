# One-shot Workflow that builds gnomeos/live-image.bst (full GNOME OS ISO).
# Apply with:
#
#   kubectl -n buildgrid create -f argo/example-live-image-workflow.yaml
#
# Uses `generateName:` so each invocation mints a unique name and you can
# fire it repeatedly. Uses `create` (not `apply`) since apply requires
# stable names.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: gnome-os-
  namespace: buildgrid
spec:
  workflowTemplateRef:
    name: gnome-build
  arguments:
    parameters:
      - name: target
        value: gnomeos/live-image.bst
      # Uncomment to build a branch/tag other than master:
      # - name: ref
      #   value: master
