# MinIO — single-node S3-compatible artifact store.
# Runner Jobs `mc cp` finished ISOs here → stable URL for humans (or a
# release page) to pull from. Later can back the "publish to GitHub
# release" step too.
#
# Prerequisite: the `minio-root` Secret must exist first. See
# `07-minio-secret.example.yaml` for the template.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: buildgrid
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: buildgrid
  labels: { app: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }              # RWO PVC
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-root
          ports:
            - { name: s3,      containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
# Internal S3 endpoint — used by Job upload step.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: buildgrid
spec:
  selector: { app: minio }
  ports:
    - { name: s3,      port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# External — hit from your laptop for downloads + admin console.
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: buildgrid
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: s3,      port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
