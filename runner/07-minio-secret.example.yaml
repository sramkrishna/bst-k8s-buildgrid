# MinIO root credentials.
#
# Copy this file to `07-minio-secret.yaml` (which is gitignored) and replace
# REPLACE_ME with a strong password before `kubectl apply`. This secret must
# exist before 07-minio.yaml is applied (the Deployment does `envFrom` on it).
#
#   cp runner/07-minio-secret.example.yaml runner/07-minio-secret.yaml
#   openssl rand -base64 32   # or any generator; MinIO wants 8+ chars
#   # paste into runner/07-minio-secret.yaml
#   kubectl apply -f runner/07-minio-secret.yaml
#   kubectl apply -f runner/07-minio.yaml
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: buildgrid
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: REPLACE_ME
