# BuildStream config for pods running INSIDE the cluster.
# Uses ClusterIP DNS names — no NodePort hop needed.

cache:
  storage-service:
    url: http://buildgrid.buildgrid.svc.cluster.local:50051

remote-execution:
  execution-service:
    url: http://buildgrid.buildgrid.svc.cluster.local:50051
  storage-service:
    url: http://buildgrid.buildgrid.svc.cluster.local:50051
  action-cache-service:
    url: http://buildgrid.buildgrid.svc.cluster.local:50051
