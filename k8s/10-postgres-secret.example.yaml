# Example secret manifest — DO NOT APPLY AS-IS. Copy to
# `10-postgres-secret.yaml` (which is gitignored) and replace REPLACE_ME with a
# real generated password before `kubectl apply`.
#
#   cp k8s/10-postgres-secret.example.yaml k8s/10-postgres-secret.yaml
#   # generate a strong password (any method):
#   openssl rand -base64 32
#   # edit k8s/10-postgres-secret.yaml, paste the value
#   kubectl apply -f k8s/10-postgres-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: buildgrid
type: Opaque
stringData:
  POSTGRES_USER: bgd
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: bgd
