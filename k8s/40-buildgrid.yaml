# BuildGrid — one process, hosts all REAPI services on port 50051.
# Now with a persistent CAS PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bgd-cas-store
  namespace: buildgrid
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buildgrid
  namespace: buildgrid
spec:
  selector:
    app: buildgrid
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: buildgrid-external
  namespace: buildgrid
spec:
  type: NodePort
  selector:
    app: buildgrid
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      nodePort: 30515
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildgrid
  namespace: buildgrid
spec:
  replicas: 1
  strategy:
    type: Recreate                 # RWO PVC — never two pods at once
  selector:
    matchLabels:
      app: buildgrid
  template:
    metadata:
      labels:
        app: buildgrid
    spec:
      containers:
        - name: buildgrid
          image: registry.gitlab.com/buildgrid/buildgrid.hub.docker.com/buildgrid:nightly
          imagePullPolicy: IfNotPresent
          command: ["bgd"]
          args: ["server", "start", "-vvv", "/app/config/controller.yml"]
          ports:
            - containerPort: 50051
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /app/config/controller.yml
              subPath: controller.yml
            - name: store
              mountPath: /var/lib/buildgrid/store
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: bgd-config
        - name: store
          persistentVolumeClaim:
            claimName: bgd-cas-store
