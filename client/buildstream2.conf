# BuildStream 2.x user config — copy to ~/.config/buildstream2.conf on the
# machine running `bst`, then adjust the URL to any node in your cluster.
#
# Both blocks are required:
#   cache.storage-service        → makes bst's local casd proxy to remote
#                                  (adds --cas-remote at casd spawn time).
#                                  Without this, bst's Python-side CAS
#                                  upload path drops blobs silently and
#                                  BuildGrid rejects the action with
#                                  "Missing entries under root directory".
#   remote-execution.*           → where bst submits actions.
#
# Instance name is empty (default) — every worked reference uses "".

cache:
  storage-service:
    url: http://192.168.88.11:30515

remote-execution:
  execution-service:
    url: http://192.168.88.11:30515
  storage-service:
    url: http://192.168.88.11:30515
  action-cache-service:
    url: http://192.168.88.11:30515
